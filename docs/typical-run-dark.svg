<text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#6FB39C" x="788" y="73" text-anchor="middle" style="font-size:10px">any step, not just the end</text>
<text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7A756E" letter-spacing="0.14em" x="64" y="110" text-anchor="start" style="font-size:11px">THE AGENT</text>
