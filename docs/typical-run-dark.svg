<rect fill="#201F1D" stroke="#6FB39C" stroke-width="2" x="275" y="32" width="181" height="52" rx="2"/>
<text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#E3E0DA" x="366" y="56" text-anchor="middle" style="font-size:15px">correct it</text>
<text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#6FB39C" x="366" y="73" text-anchor="middle" style="font-size:10px">by hand, or ask the agent</text>
