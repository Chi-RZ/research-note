<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" role="img" aria-label="Two lanes and two bands. Top, what only you do: hand over a goal, correct it at any step, close it, ask for a lift. Below it, what the agent does: plan, run, analyze, distil, each naming the skills it drives, with an arc returning from analyze to plan where the page decides what runs next. Beneath both, the dashboard showing what is running, unclosed and needing attention; and the fixer with the linters, holding the procedure and keeping every page in one shape without repairing anything.">


<text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7A756E" letter-spacing="0.14em" x="64" y="24" text-anchor="start" style="font-size:11px">YOU</text>
<rect fill="#201F1D" stroke="#6FB39C" stroke-width="2" x="64" y="32" width="181" height="52" rx="2"/>
