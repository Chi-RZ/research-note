[project]
name = "tfim-simple-update-example"
version = "0.1.0"
description = "Quimb simple-update convergence against QuSpin exact diagonalization"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.11.2",
    "networkx==3.7",
    "numpy==2.5.3",
    "quimb==1.15.0",
    "quspin==1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfim_compare"]
