name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The suite needs python3, git and a POSIX shell — nothing else. It creates
    # its own repositories and its own fake HOME, so it does not touch the
    # runner's, and it never calls the `claude` or `codex` CLIs: every test that
    # needs one stubs it. That is why this file is eight lines of setup and no
    # service containers.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - name: git identity (the shell suite builds real repositories)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - run: python -m pytest plugins/research-note/scripts/tests -q
