name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # Fast parser, policy, configuration and isolated runtime checks run at both
    # supported compatibility endpoints.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two jobs pair the Python endpoints with both supported shells.
          # Intermediate Python minors add no independent compatibility edge.
          - os: ubuntu-latest
            python: "3.10"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # pyyaml is the suite's only third-party import beyond pytest — one
      # test parses the skills' ```yaml blocks with a REAL parser, because
      # the defect it catches (`03.014` loading as the float 3.014) is
      # invisible to anything less.
      - run: pip install pytest pyyaml
      - run: python -m pytest plugins/research-note/scripts/tests -q -m "not integration"

  integration:
    # Real repositories, shell entrypoints and transactional setup/update paths
    # run once instead of being repeated for every OS/Python pair.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest pyyaml
      - name: git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - run: python -m pytest plugins/research-note/scripts/tests -q -m integration
      - name: example model checks
        run: python -m pytest examples/tfim-simple-update/tests -q
